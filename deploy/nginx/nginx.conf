# ============================================================
# NYNU Code Lab Nginx 配置
# ============================================================
# HTTPS 启用步骤（Let's Encrypt）：
#   1. 确保域名 DNS 已指向本机
#   2. 安装 certbot: apt install certbot python3-certbot-nginx
#   3. 获取证书: certbot --nginx -d your-domain.com -d admin.your-domain.com
#   4. 取消 HTTPS server block 注释，重启 Nginx
#   5. certbot renew --dry-run 验证自动续期
#
# 路由规则（按优先级排序）：
#   /api/     → 代理到后端 backend:8080
#   /uploads/ → 后端上传文件静态服务
#   /doc.html → Knife4j 文档
#   /v3/      → OpenAPI 规范
#   /admin/   → 后台管理 SPA（Vue Router history 模式）
#   /         → 前台 SPA（Vue Router history 模式）
# ============================================================

upstream backend {
    server backend:8080;
}

# ============================================================
# HTTP → HTTPS 重定向（启用 HTTPS 后取消注释）
# ============================================================
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

# ============================================================
# HTTP server（HTTPS 未启用前的临时入口）
# ============================================================
# 限流配置（DDoS / 暴力破解防御）
# 每个 IP 每秒最多 10 个请求，突发允许 20 个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 每个 IP 最大并发连接数
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};

    # 上传文件大小限制
    client_max_body_size 10M;

    # 单 IP 最大并发连接数
    limit_conn conn_limit 20;

    # 全局 UTF-8 编码（HTTP Content-Type 头优先于 HTML <meta charset>）
    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/ttf font/woff font/woff2 application/font-woff application/font-woff2 image/x-icon;
    gzip_min_length 1024;
    gzip_vary on;

    # ==================== 安全响应头 ====================
    # 防止点击劫持
    add_header X-Frame-Options "DENY" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 控制 Referer 信息泄露
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 限制浏览器功能权限
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 内容安全策略（按实际需求调整）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ========== API 代理 ==========
    location /api/ {
        # 应用请求频率限制
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端健康检查与长连接超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ========== 上传文件静态服务 ==========
    # 文件由后端写入 uploads-data 卷，Nginx 通过 alias 提供静态文件访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Knife4j / OpenAPI 文档代理 ==========
    location /doc.html {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ========== 后台管理 SPA /admin/ ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # ========== 前台 SPA / ==========
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
        # SPA 入口文件禁止缓存，确保用户始终获取最新版本
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

