# ============================================================
# NYNU Code Lab Nginx 配置
# 路由规则（按优先级排序）：
#   /api/     → 代理到后端 backend:8080
#   /uploads/ → 后端上传文件静态服务（后端已映射该目录）
#   /doc.html → Knife4j 文档
#   /v3/      → OpenAPI 规范
#   /admin/   → 后台管理 SPA（Vue Router history 模式）
#   /         → 前台 SPA（Vue Router history 模式）
# ============================================================

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # 上传文件大小限制
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ========== API 代理 ==========
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端健康检查与长连接超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ========== 上传文件静态服务 ==========
    # 文件由后端写入 uploads-data 卷，Nginx 通过 alias 提供静态文件访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Knife4j / OpenAPI 文档代理 ==========
    location /doc.html {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ========== 后台管理 SPA /admin/ ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # ========== 前台 SPA / ==========
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
