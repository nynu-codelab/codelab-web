# ============================================================
# NYNU Code Lab Docker Compose 配置
# ============================================================
# 启动：  docker compose --env-file .env up -d --build
# 查看：  docker compose ps
# 日志：  docker compose logs -f backend
# 停止：  docker compose down
# 清理：  docker compose down -v
# ============================================================

services:
  # ==================== MySQL 8 ====================
  mysql:
    image: mysql:8.0
    container_name: nynu-code-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nynu_code_lab}
      MYSQL_USER: ${MYSQL_USER:-nynu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nynu-code-lab-net

  # ==================== Redis（预留，当前未使用） ====================
  redis:
    image: redis:7-alpine
    container_name: nynu-code-lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nynu-code-lab-net
    # 注释：当前后端尚未引入 Redis 业务依赖，此服务为后续功能预留。
    # 如需禁用 Redis，执行：docker compose --profile no-redis up
    profiles:
      - all
      - ""

  # ==================== 后端 Spring Boot ====================
  backend:
    build:
      context: ../backend
    container_name: nynu-code-lab-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nynu_code_lab}
      MYSQL_USER: ${MYSQL_USER:-nynu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nynu-code-lab-net

  # ==================== Nginx 统一入口 ====================
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    container_name: nynu-code-lab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - nynu-code-lab-net

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# ==================== 容器网络 ====================
networks:
  nynu-code-lab-net:
    driver: bridge
