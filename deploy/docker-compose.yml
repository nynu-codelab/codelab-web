# ============================================================
# NYNU Code Lab Docker Compose 配置
# ============================================================
# 首次启动：
#   1. cp deploy/.env.example deploy/.env
#   2. 编辑 deploy/.env，填写 MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, JWT_SECRET
#   3. docker compose --env-file deploy/.env up -d --build
#
# 管理：
#   状态：docker compose ps
#   日志：docker compose logs -f backend
#   停止：docker compose down
#   清理：docker compose down -v
# ============================================================

services:
  # ==================== MySQL 8 ====================
  mysql:
    image: mysql:8.0
    container_name: nynu-code-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nynu_code_lab}
      MYSQL_USER: ${MYSQL_USER:-nynu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nynu-code-lab-net

  # ==================== Redis 7 ====================
  redis:
    image: redis:7-alpine
    container_name: nynu-code-lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nynu-code-lab-net

  # ==================== 后端 Spring Boot ====================
  backend:
    build:
      context: ../backend
    container_name: nynu-code-lab-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # SERVER_PORT: 容器内部端口，默认 8080，不建议修改（Nginx upstream 硬编码 8080）
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nynu_code_lab}
      MYSQL_USER: ${MYSQL_USER:-nynu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # 文件上传目录（容器内路径）
      UPLOAD_BASE_PATH: /app/uploads
      # Redis 连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      AUTH_REDIS_ENABLED: "true"
    ports:
      # BACKEND_PORT: 宿主机端口映射，默认 8080
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - nynu-code-lab-net

  # ==================== Nginx 统一入口 ====================
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    container_name: nynu-code-lab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nynu-code-lab-net

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local

# ==================== 容器网络 ====================
networks:
  nynu-code-lab-net:
    driver: bridge
