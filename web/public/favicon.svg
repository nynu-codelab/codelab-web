<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NYNU Code Lab">
  <defs>
    <linearGradient id="codelab-shell" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#53e7ff"/>
      <stop offset="0.62" stop-color="#24d8e8"/>
      <stop offset="1" stop-color="#2ff0b6"/>
    </linearGradient>
    <linearGradient id="codelab-prompt" x1="20" y1="24" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#53e7ff"/>
      <stop offset="1" stop-color="#2ff0b6"/>
    </linearGradient>
    <filter id="codelab-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#06090f"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="#08111f" stroke="rgba(153,217,255,0.18)" stroke-width="1"/>
  <path
    d="M43 14H20c-6.1 0-10 4-10 10v16c0 6 3.9 10 10 10h23"
    fill="none"
    stroke="url(#codelab-shell)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#codelab-glow)"
  />
  <path
    d="M24 25l12 7-12 7"
    fill="none"
    stroke="url(#codelab-prompt)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M45 25v15"
    fill="none"
    stroke="#2ff0b6"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <circle class="status" cx="50.5" cy="47" r="4" fill="#ffd36a"/>
  <style>
    .status {
      filter: drop-shadow(0 0 7px rgba(255, 211, 106, 0.72));
      transform-origin: 50.5px 47px;
      animation: status-pulse 2.4s ease-in-out infinite;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 0.78; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .status { animation: none; }
    }
  </style>
</svg>
