# ============================================================
# 共享配置（所有 profile 生效）
# ============================================================
# 激活 profile 方式：
#   本地开发：--spring.profiles.active=local（默认）
#   容器部署：--spring.profiles.active=docker
# ============================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nynu-code-lab
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  # 排除 Redis 自动配置，由 app.auth.redis-enabled 手动控制
  # Redis 连接参数由 cn.edu.nynu.codelab.config.RedisConfig 直接读取
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Redis 连接参数（app.auth.redis-enabled=true 时由 RedisConfig 读取）
# 所有参数均支持环境变量覆盖
app.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  timeout: 3000

# ============================================================
# 应用自定义配置
# ============================================================
app:
  upload:
    base-path: ${UPLOAD_BASE_PATH:uploads}
    url-prefix: /uploads
  auth:
    # Redis 化开关：true 使用 Redis 实现（生产推荐），false 使用内存实现（开发默认）
    redis-enabled: ${AUTH_REDIS_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: Authorization
  timeout: 604800
  token-style: tik
  is-print: false
  jwt-secret-key: ${JWT_SECRET}
  token-prefix: "Bearer"

knife4j:
  enable: true
  setting:
    language: zh_cn
