# ============================================================
# 共享配置（所有 profile 生效）
# ============================================================
# 激活 profile 方式：
#   本地开发：--spring.profiles.active=local（默认）
#   容器部署：--spring.profiles.active=docker
# ============================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nynu-code-lab
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# ============================================================
# 应用自定义配置
# ============================================================
app:
  upload:
    base-path: ${UPLOAD_BASE_PATH:uploads}
    url-prefix: /uploads

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: Authorization
  timeout: 604800
  token-style: tik
  is-print: false
  jwt-secret-key: ${JWT_SECRET:nynu_code_lab_jwt_secret_key_2026}
  token-prefix: "Bearer"

knife4j:
  enable: true
  setting:
    language: zh_cn
