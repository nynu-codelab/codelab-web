server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nynu_se_lab?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root   # TODO: 修改为实际密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: Authorization
  token-style: tik
  is-print: false
  jwt-secret-key: nynu_se_lab_jwt_secret_key_2026   # TODO: 修改为实际密钥
  # JWT 模式
  token-prefix: ""

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
